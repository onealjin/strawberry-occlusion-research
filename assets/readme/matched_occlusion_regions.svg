    <path id="calyx" d="M116 48h30v1h-30zM116 49h30v1h-30zM116 50h30v1h-30zM116 51h30v1h-30zM116 52h30v1h-30zM116 53h30v1h-30zM116 54h30v1h-30zM116 55h30v1h-30zM116 56h30v1h-30zM116 57h30v1h-30zM116 58h30v1h-30zM116 59h30v1h-30zM116 60h30v1h-30zM116 61h30v1h-30zM116 62h30v1h-30zM116 63h30v1h-30zM116 64h30v1h-30z" fill="#56a96a"/>
